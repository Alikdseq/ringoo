# Пример Nginx TLS termination → frontend :3000 / optional backend :8000
# Получите сертификат (certbot) и подставьте пути. Не открывайте 5432/6379.

upstream ringoo_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream ringoo_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name shop.example.com;

    ssl_certificate     /etc/letsencrypt/live/shop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example.com/privkey.pem;

    # Базовые заголовки
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 20m;

    # Next.js (same-origin /api/v1 proxy внутри приложения — предпочтительно)
    location / {
        proxy_pass http://ringoo_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
}

