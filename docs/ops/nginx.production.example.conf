# Nginx TLS termination для https://ringoo15.store
# Сертификат: certbot (или уже выпущенный LE). Не открывайте 5432/6379.
# Канонический Caddy-вариант: docs/ops/caddy.ringoo15.store.caddyfile

upstream ringoo_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream ringoo_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name ringoo15.store www.ringoo15.store;
    return 301 https://ringoo15.store$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ringoo15.store www.ringoo15.store;

    ssl_certificate     /etc/letsencrypt/live/ringoo15.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ringoo15.store/privkey.pem;

    # Базовые заголовки
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 20m;

    # www → apex
    if ($host = www.ringoo15.store) {
        return 301 https://ringoo15.store$request_uri;
    }

    # Next.js (same-origin /api/v1 proxy внутри приложения — предпочтительно)
    location / {
        proxy_pass http://ringoo_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
}

# Если Django слушает отдельно (без Next proxy):
