# §10.2.1: DAST вручную против развёрнутого URL (staging). localhost с runner недоступен.
name: DAST (OWASP ZAP Baseline)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Базовый URL (например https://staging.ringoo.example)"
        required: true
        type: string

jobs:
  zap-baseline:
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest
    steps:
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ inputs.target_url }}
        continue-on-error: true

      - name: Артефакты отчёта
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
          if-no-files-found: ignore
