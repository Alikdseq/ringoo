[project]
name = "ringoo-backend"
version = "0.1.0"
description = "Ringoo store API"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.0,<6.0",
    "djangorestframework>=3.14.0",
    "djangorestframework-simplejwt>=5.3.0",
    "argon2-cffi>=23.1.0",
    "psycopg[binary]>=3.1.8",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.1",
    "celery[redis]>=5.3.4",
    "django-redis>=5.4.0",
    "drf-spectacular>=0.26.5",
    "django-cors-headers>=4.3.1",
    "python-dotenv>=1.2.0",
    "Pillow>=10.2.0",
    "openpyxl>=3.1.0",
    "sentry-sdk>=1.38.0",
    "django-storages>=1.14.2",
    "boto3>=1.34.0",
    "whitenoise>=6.6.0",
    "gunicorn>=22.0.0",
    "python-json-logger>=2.0.7",
    "python-dateutil>=2.8.2",
    "tenacity>=8.2.0",
    "django-axes>=6.4,<7",
    "django-otp>=1.5,<2",
    "qrcode[pil]>=7.4",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "config.wsgi:application"

[tool.vercel.scripts]
build = "python scripts/vercel_build.py"

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | env
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip = ["migrations"]
skip_glob = ["*/migrations/*"]

[tool.mypy]
python_version = "3.11"
# Не типизируем автогенерируемые миграции
exclude = "(^|/|\\\\)migrations(/|\\\\)"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_strict_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "django.*",
    "rest_framework.*",
    "celery.*",
    "redis.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = """
    --verbose
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
"""
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "api: marks tests as API tests",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/venv/*",
    "*/env/*",
    "*/tests/*",
    "manage.py",
    "*/settings/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
